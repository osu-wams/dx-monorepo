name: Lint, Build, Test, and Publish (master)
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # See https://github.com/lerna/lerna/issues/2542
      - name: Begin CI...
        uses: actions/checkout@v5
        with:
          # This forces GitHub Actions to checkout the actual branch reference rather than a detached SHA
          ref: ${{ github.head_ref || github.ref_name }}
          # pulls all commits (needed for lerna / semantic release to correctly version)
          fetch-depth: '0'

      # pulls all tags (needed for lerna / semantic release to correctly version)
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nodeModules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            nodeModules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          CI: true
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GITHUB_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}

      - name: Lint
        run: yarn lint
        env:
          CI: true

      - name: Build
        run: yarn build
        env:
          CI: true
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GITHUB_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}

      - name: Typecheck
        run: yarn typecheck
        env:
          CI: true

      - name: Test
        run: yarn test
        env:
          CI: true
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GITHUB_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}

      - name: report code coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: publish package(s) with changes
        if: github.ref == 'refs/heads/master'
        run: |
          git config --global user.name 'osu-wams github action'
          git config --global user.email 'noreply@oregonstate.edu'
          yarn publish:patch --yes --force-publish=*
        env:
          CI: true
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GITHUB_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}
